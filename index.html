<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============ EASY CUSTOMIZATION ============
     Her name:      search for  Tina
     Her photo:     search for  tina.jpg
     The message:   search for  YOUR MESSAGE HERE
  ============================================= */

  :root{
    --deep: #0a0713;
    --mid: #1c1130;
    --plum: #35204f;
    --gold: #e8b84b;
    --gold-soft: #f4d888;
    --rose: #ff7d95;
    --teal: #4fd8c4;
    --cream: #f7f1e3;
    --cream-dim: #cabfa9;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--deep);
    color: var(--cream);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .serif{ font-family: 'Cormorant Garamond', 'Georgia', serif; }

  canvas{ position: fixed; inset: 0; display: block; }
  #bg{ z-index: 0; }
  #fx{ z-index: 5; pointer-events: none; }

  .aurora{
    position: fixed; inset: -20%;
    z-index: 0;
    background:
      radial-gradient(40% 35% at 20% 15%, rgba(255,125,149,0.16), transparent 60%),
      radial-gradient(45% 40% at 80% 20%, rgba(79,216,196,0.14), transparent 60%),
      radial-gradient(50% 45% at 50% 85%, rgba(232,184,75,0.14), transparent 60%);
    filter: blur(10px);
    animation: auroraDrift 22s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift{
    0%{ transform: translate(0,0) rotate(0deg); }
    100%{ transform: translate(-2%, 2%) rotate(4deg); }
  }

  .scene{
    position: relative; z-index: 2;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------------- TEASER / ENVELOPE ---------------- */

  .teaser{
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
    perspective: 1200px;
  }
  .teaser.hidden{
    opacity: 0; transform: scale(0.92); filter: blur(6px);
    pointer-events: none;
  }

  .eyebrow{
    font-size: 0.8rem; letter-spacing: 0.04em;
    color: var(--cream-dim); margin: 0 0 6px 0; font-weight: 400;
    opacity: 0.75;
  }

  .teaser-title{
    font-size: clamp(2.6rem, 9vw, 4.4rem);
    font-style: italic; font-weight: 600;
    margin: 0 0 34px 0; line-height: 1;
    background: linear-gradient(135deg, var(--gold-soft), var(--rose) 60%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 46px rgba(232,184,75,0.18);
  }

  .env-wrap{
    width: min(78vw, 300px);
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.25s ease;
  }

  .envelope{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    transform-style: preserve-3d;
  }

  .env-back{
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #3a2354, #241436 70%);
    border-radius: 10px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(244,216,136,0.12);
  }

  .env-letter{
    position: absolute;
    left: 6%; right: 6%; top: 10%;
    height: 78%;
    background: linear-gradient(180deg, #fffaf0, var(--cream));
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    z-index: 2;
    transform: translateY(6%);
    transition: transform 0.85s cubic-bezier(.2,.8,.25,1);
  }
  .env-letter::before, .env-letter::after{
    content: ''; position: absolute; left: 14%; right: 14%; height: 2px;
    background: rgba(53,32,79,0.12);
  }
  .env-letter::before{ top: 30%; }
  .env-letter::after{ top: 46%; }
  .env-letter.rise{
    transform: translateY(-86%);
    z-index: 5;
    transition: transform 1s cubic-bezier(.22,1,.36,1), z-index 0s;
  }

  .env-front{
    position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
    background: linear-gradient(200deg, #4a2c68, #2c1a41);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 50% 34%);
    border-radius: 0 0 10px 10px;
    z-index: 3;
    box-shadow: inset 0 1px 0 rgba(244,216,136,0.1);
  }

  .env-flap{
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: linear-gradient(200deg, #4e2f6e, #2c1a41);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    z-index: 4;
    border-radius: 10px 10px 0 0;
    transition: transform 0.85s cubic-bezier(.65,0,.35,1);
    will-change: transform;
    backface-visibility: hidden;
    box-shadow: inset 0 -1px 0 rgba(244,216,136,0.1);
  }
  .env-flap.open{
    transform: rotateX(-165deg);
  }
  /* z-index is switched separately by JS once the flap has rotated
     past the point where it's edge-on to the viewer, so it tucks
     behind the pocket instead of popping behind it mid-fold */
  .env-flap.behind{
    z-index: 1;
  }

  .wax-seal{
    position: absolute; left: 50%; top: 42%;
    width: 52px; height: 52px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ff8fa0, var(--rose) 55%, #b13a55 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 600; font-size: 1.4rem;
    color: rgba(255,255,255,0.92);
    box-shadow: 0 8px 18px rgba(0,0,0,0.4), inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.35);
    z-index: 6;
    transition: transform 0.4s cubic-bezier(.4,1.6,.5,1), opacity 0.4s ease;
  }
  .wax-seal.cracked{
    transform: translate(-50%, -50%) scale(0.4) rotate(35deg);
    opacity: 0;
  }

  .hint{
    margin-top: 30px;
    font-size: 0.85rem; color: var(--cream-dim); opacity: 0.7;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity: 0.45; } 50%{ opacity: 0.85; } }

  /* ---------------- INVITATION CARD ---------------- */

  .invitation{
    position: fixed; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease;
  }
  .invitation.show{ opacity: 1; pointer-events: auto; }

  .card{
    width: min(92vw, 520px);
    max-height: 88vh;
    overflow-y: auto;
    text-align: center;
    padding: clamp(28px, 5vw, 48px) clamp(22px, 6vw, 40px);
    border-radius: 22px;
    background: linear-gradient(165deg, rgba(53,32,79,0.55), rgba(28,17,48,0.75));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(244,216,136,0.18);
    transform: translateY(24px) scale(0.96);
    transition: transform 0.7s cubic-bezier(.2,.8,.25,1);
  }
  .invitation.show .card{ transform: translateY(0) scale(1); }

  .photo-frame{
    width: 128px; height: 128px; border-radius: 50%;
    margin: 0 auto 20px auto; padding: 4px;
    background: linear-gradient(135deg, var(--gold), var(--rose));
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }
  .photo-frame img{
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 50%; display: block; background: var(--mid);
  }

  .headline{
    font-size: clamp(2rem, 6.5vw, 3rem);
    font-style: italic; font-weight: 600; line-height: 1.08;
    margin: 0 0 18px 0;
    background: linear-gradient(135deg, var(--gold-soft), var(--rose) 65%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .card p{
    font-size: clamp(0.98rem, 2.3vw, 1.08rem);
    line-height: 1.7; color: var(--cream);
    margin: 0 0 12px 0;
    opacity: 0; transform: translateY(8px);
    animation: lineIn 0.7s ease forwards;
  }
  .card p:nth-of-type(1){ animation-delay: 0.15s; }
  .card p:nth-of-type(2){ animation-delay: 0.4s; }
  .card p.signature{ animation-delay: 0.65s; }
  @keyframes lineIn{ to{ opacity: 1; transform: translateY(0); } }

  .signature{
    margin-top: 16px; font-family: 'Cormorant Garamond', serif;
    font-style: italic; color: var(--gold-soft); font-size: 1.1rem;
  }

  .replay{
    margin-top: 26px;
    background: transparent;
    border: 1px solid rgba(247,241,227,0.25);
    color: var(--cream-dim);
    padding: 10px 22px; border-radius: 999px;
    font-size: 0.85rem; font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .replay:hover{ border-color: var(--gold); color: var(--gold-soft); background: rgba(232,184,75,0.08); }

  .footer-note{
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 0.72rem; color: rgba(202,191,169,0.3); z-index: 3;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="aurora"></div>
<canvas id="fx"></canvas>

<div class="scene">

  <div class="teaser" id="teaser">
    <p class="eyebrow">something for you</p>
    <h1 class="teaser-title serif">Tina</h1>

    <div class="env-wrap" id="envWrap" role="button" tabindex="0" aria-label="Open the envelope">
      <div class="envelope">
        <div class="env-back"></div>
        <div class="env-letter" id="envLetter"></div>
        <div class="env-front"></div>
        <div class="env-flap" id="envFlap"></div>
        <div class="wax-seal serif" id="waxSeal">T</div>
      </div>
    </div>

    <p class="hint">tap the seal to open it</p>
  </div>

  <div class="invitation" id="invitation">
    <div class="card">
      <!-- HER PHOTO — replace "tina.jpg" with your image file's name
           (kept in the same folder as this HTML file), or a full image URL -->
      <div class="photo-frame">
        <img src="tina.png" alt="Tina" onerror="this.style.display='none'">
      </div>
      <h1 class="headline serif">Happy Birthday, Tina!</h1>
      <!-- YOUR MESSAGE HERE — rewrite these lines however you like -->
      <!-- <p>Another year of you being exactly as wonderful, funny, and impossible to replace as ever. I hope today feels as good as you deserve.</p> -->
      <p>You're still the most annoying, chaotic sibling I've got. Don't let it go to your head.</p>
      <p class="signature">— unfortunately, your big-brother</p>
      <button class="replay" id="replayBtn">Open again</button>
    </div>
  </div>

</div>

<!-- <div class="footer-note">made with a little bit of code and a lot of love</div> -->

<script>
(function(){
  // ---------------- ambient background particles ----------------
  const bg = document.getElementById('bg');
  const bctx = bg.getContext('2d');
  let W, H, DPR;
  let fireflies = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [bg, document.getElementById('fx')].forEach(c => {
      c.width = W * DPR; c.height = H * DPR;
      c.style.width = W + 'px'; c.style.height = H + 'px';
    });
    bctx.setTransform(DPR,0,0,DPR,0,0);
    fxctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function initFireflies(){
    const count = Math.round((W * H) / 22000);
    fireflies = Array.from({length: count}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.6,
      baseA: Math.random() * 0.5 + 0.25,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.15 + 0.03,
      drift: Math.random() * 0.4 - 0.2,
      hue: Math.random() < 0.6 ? '232,184,75' : (Math.random() < 0.5 ? '255,125,149' : '79,216,196')
    }));
  }

  let parX = 0, parY = 0, targetParX = 0, targetParY = 0;
  window.addEventListener('mousemove', (e) => {
    targetParX = (e.clientX / W - 0.5) * 18;
    targetParY = (e.clientY / H - 0.5) * 18;
  });

  let t = 0;
  function drawBg(){
    t += 1;
    parX += (targetParX - parX) * 0.03;
    parY += (targetParY - parY) * 0.03;
    bctx.clearRect(0, 0, W, H);
    for(const f of fireflies){
      f.y -= f.speed;
      f.x += Math.sin(t * 0.01 + f.phase) * f.drift * 0.05;
      if(f.y < -10){ f.y = H + 10; f.x = Math.random() * W; }
      const a = f.baseA * (0.6 + 0.4 * Math.sin(t * 0.02 + f.phase));
      const gx = f.x + parX, gy = f.y + parY;
      const grad = bctx.createRadialGradient(gx, gy, 0, gx, gy, f.r * 5);
      grad.addColorStop(0, `rgba(${f.hue},${a})`);
      grad.addColorStop(1, `rgba(${f.hue},0)`);
      bctx.fillStyle = grad;
      bctx.beginPath();
      bctx.arc(gx, gy, f.r * 5, 0, Math.PI * 2);
      bctx.fill();
      bctx.fillStyle = `rgba(${f.hue},${Math.min(a * 1.6, 1)})`;
      bctx.beginPath();
      bctx.arc(gx, gy, f.r, 0, Math.PI * 2);
      bctx.fill();
    }
    requestAnimationFrame(drawBg);
  }

  // ---------------- confetti / firework burst ----------------
  const fx = document.getElementById('fx');
  const fxctx = fx.getContext('2d');
  let particles = [];
  const COLORS = ['#e8b84b', '#f4d888', '#ff7d95', '#4fd8c4', '#f7f1e3'];

  function burst(cx, cy, count){
    for(let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 3;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed * (0.4 + Math.random() * 0.6),
        vy: Math.sin(angle) * speed - 4 - Math.random() * 3,
        size: Math.random() * 6 + 4,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.3,
        life: 0,
        maxLife: 90 + Math.random() * 50,
        shape: Math.random() < 0.5 ? 'rect' : 'circle'
      });
    }
  }

  let fxRunning = false;
  function drawFx(){
    fxctx.clearRect(0, 0, W, H);
    if(particles.length === 0){ fxRunning = false; return; }
    particles.forEach(p => {
      p.vy += 0.14;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.rotSpeed;
      p.life++;
      const fade = Math.max(0, 1 - p.life / p.maxLife);
      fxctx.save();
      fxctx.translate(p.x, p.y);
      fxctx.rotate(p.rot);
      fxctx.globalAlpha = fade;
      fxctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        fxctx.fillRect(-p.size/2, -p.size/3, p.size, p.size * 0.66);
      } else {
        fxctx.beginPath();
        fxctx.arc(0, 0, p.size/2, 0, Math.PI*2);
        fxctx.fill();
      }
      fxctx.restore();
    });
    particles = particles.filter(p => p.life < p.maxLife && p.y < H + 40);
    requestAnimationFrame(drawFx);
  }
  function startFx(){
    if(!fxRunning){ fxRunning = true; drawFx(); }
  }

  resize();
  initFireflies();
  drawBg();
  window.addEventListener('resize', () => { resize(); initFireflies(); });

  // ---------------- envelope interaction ----------------
  const teaser = document.getElementById('teaser');
  const envWrap = document.getElementById('envWrap');
  const envFlap = document.getElementById('envFlap');
  const envLetter = document.getElementById('envLetter');
  const waxSeal = document.getElementById('waxSeal');
  const invitation = document.getElementById('invitation');
  const replayBtn = document.getElementById('replayBtn');

  let opened = false;

  function openEnvelope(){
    if(opened) return;
    opened = true;

    // freeze the hover tilt so it can't fight the fold animation
    envWrap.style.transition = 'transform 0.4s ease';
    envWrap.style.transform = 'rotateY(0deg) rotateX(0deg)';

    waxSeal.classList.add('cracked');

    setTimeout(() => {
      envFlap.classList.add('open');
    }, 220);

    // switch the flap behind the pocket only once it's roughly
    // edge-on to the viewer (~90deg into its 165deg fold), so the
    // layering change is invisible instead of a hard jump-cut
    setTimeout(() => {
      envFlap.classList.add('behind');
    }, 220 + 430);

    setTimeout(() => {
      envLetter.classList.add('rise');
    }, 220 + 520);

    setTimeout(() => {
      teaser.classList.add('hidden');
      invitation.classList.add('show');
      startFx();
      burst(W/2, H*0.35, 90);
      setTimeout(() => burst(W*0.25, H*0.4, 45), 200);
      setTimeout(() => burst(W*0.75, H*0.4, 45), 350);
    }, 220 + 520 + 1000);
  }

  envWrap.addEventListener('click', openEnvelope);
  envWrap.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); }
  });

  envWrap.addEventListener('mousemove', (e) => {
    if(opened) return;
    const r = envWrap.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    envWrap.style.transition = 'transform 0.25s ease';
    envWrap.style.transform = `rotateY(${px * 14}deg) rotateX(${-py * 14}deg)`;
  });
  envWrap.addEventListener('mouseleave', () => {
    if(opened) return;
    envWrap.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });

  replayBtn.addEventListener('click', () => {
    // drop the fold state instantly (no transition) so it resets
    // to "closed" without playing the animation in reverse
    envFlap.style.transition = 'none';
    envLetter.style.transition = 'none';
    envFlap.classList.remove('open', 'behind');
    envLetter.classList.remove('rise');
    waxSeal.classList.remove('cracked');
    // force reflow so the transition removal actually takes effect
    // before we restore it on the next frame
    void envFlap.offsetHeight;
    requestAnimationFrame(() => {
      envFlap.style.transition = '';
      envLetter.style.transition = '';
    });

    opened = false;
    invitation.classList.remove('show');
    teaser.classList.remove('hidden');
    startFx();
    burst(W/2, H*0.3, 60);
  });
})();
</script>

</body>
</html>
